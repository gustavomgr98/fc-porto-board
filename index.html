<meta name="theme-color" content="#0a1830">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --shell: #0a1830;
    --shell-panel: #10203c;
    --shell-panel-2: #142a4d;
    --frame: #071122;
    --board: #123262;
    --board-2: #18437c;
    --chalk: #f4f1e6;
    --chalk-dim: rgba(244,241,230,0.55);
    --pen-blue: #6db4e8;
    --pen-red: #d6564a;
    --pen-yellow: #e8c34a;
    --pen-white: #f6f3e8;
    --gold: #cda437;
    --gold-soft: #e3c467;
    --accent: #cda437;
    --text-dim: #9db2cf;
    --panel-shadow: rgba(0, 0, 0, 0.5);
    box-sizing: border-box;
  }
  *{
    box-sizing:inherit;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  html,body{
    height:100%;
    margin:0;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: radial-gradient(ellipse at 50% -10%, #142a4d 0%, #0a1830 60%);
    font-family: 'Work Sans', sans-serif;
    color: var(--chalk);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
  }
  .app{
    height:100%;
    width:100%;
    display:flex;
    flex-direction:column;
    padding: 14px 14px 10px;
    gap:10px;
    touch-action: none;
  }
  button, input[type=range]{
    touch-action: manipulation;
  }

  header{
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap: 10px;
  }
  header .mark{
    height: clamp(40px, 9vw, 52px);
    width: auto;
    flex-shrink:0;
    filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
    -webkit-user-drag: none;
    user-drag: none;
    pointer-events: none;
  }
  header .brand-block{ text-align:left; min-width:0; }
  header .brand{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    letter-spacing: 0.01em;
    font-size: clamp(19px, 4vw, 26px);
    color: var(--chalk);
    margin: 0;
    line-height: 1.1;
  }
  header .sub{
    font-style: normal;
    color: var(--text-dim);
    font-size: clamp(11px, 2.2vw, 13px);
    letter-spacing: 0.02em;
    margin-top: 1px;
  }
  header .values{
    display:flex;
    flex-wrap:wrap;
    gap: 2px 8px;
    margin-top: 4px;
  }
  header .values span{
    font-family:'Oswald', sans-serif;
    font-weight: 600;
    font-size: clamp(9px, 1.9vw, 11px);
    letter-spacing: 0.09em;
    color: var(--gold-soft);
    text-transform: uppercase;
    white-space: nowrap;
  }
  header .values span::after{
    content: "·";
    margin-left: 8px;
    color: rgba(205,164,55,0.4);
  }
  header .values span:last-child::after{ content:""; margin:0; }

  nav.tabs{
    display:flex;
    justify-content:center;
    gap: 6px;
    flex-shrink:0;
  }
  nav.tabs button{
    font-family:'Oswald', sans-serif;
    font-weight: 500;
    font-size: 14px;
    letter-spacing: 0.02em;
    padding: 7px 14px;
    border: 1px solid rgba(242,238,226,0.12);
    background: var(--shell-panel);
    color: var(--text-dim);
    border-radius: 999px;
    cursor: pointer;
    transition: transform .12s ease, background .15s ease, color .15s ease;
  }
  nav.tabs button:active{ transform: translateY(1px); }
  nav.tabs button.active{
    background: var(--accent);
    color: #221a08;
    border-color: var(--accent);
    font-weight: 600;
  }

  .board-wrap{
    flex: 1 1 auto;
    min-height: 0;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .board-frame{
    position:relative;
    height:100%;
    max-width:100%;
    background: var(--board);
    border-radius: 10px;
    box-shadow: 0 10px 28px var(--panel-shadow), inset 0 0 0 3px var(--frame), inset 0 0 0 5px rgba(242,238,226,0.06);
    border: 1px solid var(--frame);
    overflow:hidden;
    touch-action: none;
  }
  .board-frame::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      radial-gradient(ellipse at 20% 15%, rgba(255,255,255,0.05), transparent 45%),
      radial-gradient(ellipse at 85% 90%, rgba(0,0,0,0.28), transparent 55%),
      radial-gradient(ellipse at 90% 5%, rgba(255,255,255,0.04), transparent 40%);
    pointer-events:none;
  }
  canvas{
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    display:block;
  }
  #fieldCanvas{ pointer-events:none; }
  #drawCanvas{ touch-action:none; }

  .toolbar{
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 14px;
    flex-wrap: wrap;
    background: var(--shell-panel);
    border: 1px solid rgba(242,238,226,0.08);
    border-radius: 10px;
    padding: 8px 14px;
    box-shadow: 0 2px 8px var(--panel-shadow);
  }
  .swatches{ display:flex; gap:8px; align-items:center; }
  .swatch{
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 2px solid rgba(0,0,0,0.3);
    cursor:pointer;
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.35);
    padding:0;
  }
  .swatch.active{ box-shadow: 0 0 0 2px var(--shell-panel), 0 0 0 4px var(--chalk); }

  .tool-group{ display:flex; align-items:center; gap:6px; }
  .tool-group label{ font-size:12px; letter-spacing:0.02em; color: var(--text-dim); white-space:nowrap; }
  input[type=range]{ width: 70px; accent-color: var(--accent); }

  .icon-btn{
    font-family:'Work Sans', sans-serif;
    font-size: 13px;
    letter-spacing:0.01em;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid rgba(242,238,226,0.14);
    background: var(--shell-panel-2);
    color: var(--chalk);
    cursor: pointer;
  }
  .icon-btn:active{ transform: translateY(1px); }
  .icon-btn.danger{ color: var(--pen-red); border-color: rgba(226,96,79,0.4); }
  .icon-btn.eraser.active{
    background: var(--accent);
    color: #221a08;
    border-color: var(--accent);
  }
</style>
</head>

      <button class="swatch" style="background:#d6564a" data-color="#d6564a" title="Vermelho"></button>
      <button class="swatch" style="background:#6db4e8" data-color="#6db4e8" title="Azul claro"></button>
    </div>
    <div class="tool-group">
      <label for="brushSize">Traço</label>
      <input type="range" id="brushSize" min="1" max="10" value="3">
    </div>
    <button class="icon-btn eraser" id="eraserBtn">Borracha</button>
    <button class="icon-btn" id="undoBtn">Desfazer</button>
    <button class="icon-btn danger" id="clearBtn">Limpar</button>
    <button class="icon-btn" id="saveBtn">Guardar imagem</button>
  </div>
</div>

<script>
(function(){
  const boardFrame = document.getElementById('boardFrame');
  const fieldCanvas = document.getElementById('fieldCanvas');
  const drawCanvas = document.getElementById('drawCanvas');
  const fctx = fieldCanvas.getContext('2d');
  const dctx = drawCanvas.getContext('2d');

  const tabs = document.querySelectorAll('nav.tabs button');
  const swatches = document.querySelectorAll('.swatch');
  const brushSize = document.getElementById('brushSize');
  const eraserBtn = document.getElementById('eraserBtn');
  const undoBtn = document.getElementById('undoBtn');
  const clearBtn = document.getElementById('clearBtn');
  const saveBtn = document.getElementById('saveBtn');

  // Palm rejection: while the Pencil is down, ignore concurrent finger
  // touches outright; also ignore touches with an unusually large contact
  // patch (a resting palm rather than a fingertip).
  const PALM_SIZE_THRESHOLD = 50; // CSS px
  let activePenId = null; // pointerId of an actively-down Apple Pencil, or null

  const ASPECT = { full: 113/76, half: 76/60.5, box: 48.32/24.85 };
  let currentField = 'full';
  let currentColor = '#f6f3e8';
  let erasing = false;
  let dpr = Math.max(window.devicePixelRatio || 1, 1);

  // strokes[field] = array of strokes; each stroke = {color, size, points:[{x,y,p}]}
  let strokes = { full: [], half: [], box: [] };

  function loadStrokes(){
    try{
      const raw = localStorage.getItem('quadro-tatico-strokes');
      if(raw){
        const parsed = JSON.parse(raw);
        if(parsed && parsed.full && parsed.half && parsed.box){ strokes = parsed; }
      }
    }catch(e){ /* ignore, start fresh */ }
  }
  function saveStrokes(){
    try{ localStorage.setItem('quadro-tatico-strokes', JSON.stringify(strokes)); }catch(e){}
  }
  loadStrokes();

  function sizeCanvases(){
    const rect = boardFrame.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    [fieldCanvas, drawCanvas].forEach(c=>{
      c.width = Math.round(w*dpr);
      c.height = Math.round(h*dpr);
      c.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    });
    drawField();
    redrawStrokes();
  }

  function fitFrame(){
    const wrap = boardFrame.parentElement;
    const wrapRect = wrap.getBoundingClientRect();
    const targetAspect = ASPECT[currentField]; // width/height
    let h = wrapRect.height;
    let w = h * targetAspect;
    if(w > wrapRect.width){
      w = wrapRect.width;
      h = w / targetAspect;
    }
    boardFrame.style.width = w + 'px';
    boardFrame.style.height = h + 'px';
    sizeCanvases();
  }

  // ---------- Field drawing (vintage engraved-line pitches) ----------
  function inkStroke(ctx){
    ctx.strokeStyle = 'rgba(244,241,230,0.8)';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.shadowColor = 'rgba(0,0,0,0.35)';
    ctx.shadowBlur = 0.6;
  }

  function drawField(){
    const w = fieldCanvas.clientWidth, h = fieldCanvas.clientHeight;
    fctx.clearRect(0,0,w,h);
    inkStroke(fctx);
    if(currentField === 'full') drawFull(fctx, w, h);
    else if(currentField === 'half') drawHalf(fctx, w, h);
    else drawBox(fctx, w, h);
  }

  // Real pitch measurements in metres, used to keep every line true to scale
  // (no stretching in x or y) regardless of the canvas size.
  const M = {
    L: 105, Wd: 68,           // full pitch length / width
    Pd: 16.5, Pw: 40.32,      // penalty area depth / width
    Sd: 5.5,  Sw: 18.32,      // six-yard box depth / width
    Ps: 11,                   // penalty spot distance from goal line
    Ar: 9.15,                 // arc / center circle radius
    Gw: 7.32, Gd: 2.2,        // goal width / visual depth
    Cor: 1                    // corner arc radius
  };

  // Maps a viewW x viewH metre-space onto the canvas, centered, at one
  // uniform scale so shapes are never stretched.
  function makeView(W, H, viewW, viewH, padFrac){
    const pad = Math.min(W,H)*padFrac;
    const scale = Math.min((W-2*pad)/viewW, (H-2*pad)/viewH);
    const offX = (W - viewW*scale)/2;
    const offY = (H - viewH*scale)/2;
    return {
      scale,
      X: m => offX + m*scale,
      Y: m => offY + m*scale
    };
  }

  function drawFull(ctx, W, H){
    const margin = 4;
    const viewW = M.L + margin*2, viewH = M.Wd + margin*2;
    const v = makeView(W, H, viewW, viewH, 0.02);
    const lw = Math.max(1.2, v.scale*0.11);
    ctx.lineWidth = lw;

    ctx.strokeRect(v.X(margin), v.Y(margin), v.scale*M.L, v.scale*M.Wd);

    const midXm = margin + M.L/2;
    ctx.beginPath(); ctx.moveTo(v.X(midXm), v.Y(margin)); ctx.lineTo(v.X(midXm), v.Y(margin+M.Wd)); ctx.stroke();

    const cyM = margin + M.Wd/2;
    ctx.beginPath(); ctx.arc(v.X(midXm), v.Y(cyM), M.Ar*v.scale, 0, Math.PI*2); ctx.stroke();
    dot(ctx, v.X(midXm), v.Y(cyM), lw*1.6);

    drawGoalSideFull(ctx, v, margin, cyM, 1);
    drawGoalSideFull(ctx, v, margin+M.L, cyM, -1);

    const cr = M.Cor*v.scale;
    corner(ctx, v.X(margin), v.Y(margin), cr, 0, Math.PI/2);
    corner(ctx, v.X(margin+M.L), v.Y(margin), cr, Math.PI/2, Math.PI);
    corner(ctx, v.X(margin), v.Y(margin+M.Wd), cr, -Math.PI/2, 0);
    corner(ctx, v.X(margin+M.L), v.Y(margin+M.Wd), cr, Math.PI, Math.PI*1.5);
  }

  function drawGoalSideFull(ctx, v, baseXm, cyM, dir){
    const px = dir===1 ? baseXm : baseXm - M.Pd;
    ctx.strokeRect(v.X(px), v.Y(cyM-M.Pw/2), M.Pd*v.scale, M.Pw*v.scale);
    const sx = dir===1 ? baseXm : baseXm - M.Sd;
    ctx.strokeRect(v.X(sx), v.Y(cyM-M.Sw/2), M.Sd*v.scale, M.Sw*v.scale);

    const spotXm = baseXm + dir*M.Ps;
    dot(ctx, v.X(spotXm), v.Y(cyM), ctx.lineWidth*1.6);

    const thresh = Math.acos((M.Pd-M.Ps)/M.Ar);
    const startA = dir===1 ? -thresh : Math.PI-thresh;
    const endA = dir===1 ? thresh : Math.PI+thresh;
    ctx.beginPath(); ctx.arc(v.X(spotXm), v.Y(cyM), M.Ar*v.scale, startA, endA); ctx.stroke();

    const gx = dir===1 ? baseXm - M.Gd : baseXm;
    ctx.strokeRect(v.X(gx), v.Y(cyM-M.Gw/2), M.Gd*v.scale, M.Gw*v.scale);
  }

  function drawHalf(ctx, W, H){
    const margin = 4;
    const viewW = M.Wd + margin*2, viewH = M.L/2 + margin*2;
    const v = makeView(W, H, viewW, viewH, 0.02);
    const lw = Math.max(1.2, v.scale*0.11);
    ctx.lineWidth = lw;

    const midXm = margin + M.Wd/2;
    // pitch boundary (goal line at top, halfway line as bottom edge)
    ctx.strokeRect(v.X(margin), v.Y(margin), M.Wd*v.scale, (M.L/2)*v.scale);

    ctx.strokeRect(v.X(midXm-M.Pw/2), v.Y(margin), M.Pw*v.scale, M.Pd*v.scale);
    ctx.strokeRect(v.X(midXm-M.Sw/2), v.Y(margin), M.Sw*v.scale, M.Sd*v.scale);

    const spotYm = margin + M.Ps;
    dot(ctx, v.X(midXm), v.Y(spotYm), lw*1.6);

    const thresh = Math.asin((M.Pd-M.Ps)/M.Ar);
    ctx.beginPath(); ctx.arc(v.X(midXm), v.Y(spotYm), M.Ar*v.scale, thresh, Math.PI-thresh); ctx.stroke();

    ctx.strokeRect(v.X(midXm-M.Gw/2), v.Y(margin-M.Gd), M.Gw*v.scale, M.Gd*v.scale);

    // halfway line + center circle (only the near semicircle is visible)
    const halfwayYm = margin + M.L/2;
    ctx.beginPath(); ctx.arc(v.X(midXm), v.Y(halfwayYm), M.Ar*v.scale, Math.PI, Math.PI*2); ctx.stroke();
    dot(ctx, v.X(midXm), v.Y(halfwayYm), lw*1.6);

    const cr = M.Cor*v.scale;
    corner(ctx, v.X(margin), v.Y(margin), cr, 0, Math.PI/2);
    corner(ctx, v.X(margin+M.Wd), v.Y(margin), cr, Math.PI/2, Math.PI);
  }

  function drawBox(ctx, W, H){
    const marginX = 4, marginBottom = 2.5;
    const farArc = M.Ps + M.Ar;
    const viewW = M.Pw + marginX*2;
    const viewH = M.Gd + Math.max(M.Pd, farArc) + marginBottom;
    const v = makeView(W, H, viewW, viewH, 0.02);
    const lw = Math.max(1.3, v.scale*0.12);
    ctx.lineWidth = lw;

    const midXm = marginX + M.Pw/2;

    // goal line, extended a little past the box for a natural look
    ctx.beginPath();
    ctx.moveTo(v.X(marginX-3), v.Y(M.Gd));
    ctx.lineTo(v.X(marginX+M.Pw+3), v.Y(M.Gd));
    ctx.stroke();

    ctx.strokeRect(v.X(midXm-M.Gw/2), v.Y(0), M.Gw*v.scale, M.Gd*v.scale);
    ctx.strokeRect(v.X(marginX), v.Y(M.Gd), M.Pw*v.scale, M.Pd*v.scale);
    ctx.strokeRect(v.X(midXm-M.Sw/2), v.Y(M.Gd), M.Sw*v.scale, M.Sd*v.scale);

    const spotYm = M.Gd + M.Ps;
    dot(ctx, v.X(midXm), v.Y(spotYm), lw*1.8);

    const boxBottomYm = M.Gd + M.Pd;
    const thresh = Math.asin((boxBottomYm-spotYm)/M.Ar);
    ctx.beginPath(); ctx.arc(v.X(midXm), v.Y(spotYm), M.Ar*v.scale, thresh, Math.PI-thresh); ctx.stroke();
  }

  function dot(ctx, x, y, r){
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fillStyle = ctx.strokeStyle; ctx.fill();
  }
  function corner(ctx, x, y, r, a1, a2){
    ctx.beginPath(); ctx.arc(x, y, r, a1, a2); ctx.stroke();
  }

  // ---------- Drawing layer ----------
  function redrawStrokes(){
    const w = drawCanvas.clientWidth, h = drawCanvas.clientHeight;
    dctx.clearRect(0,0,w,h);
    strokes[currentField].forEach(s => paintStroke(s));
  }

  function paintStroke(stroke){
    if(stroke.points.length < 1) return;
    dctx.lineCap = 'round';
    dctx.lineJoin = 'round';
    if(stroke.erase){
      dctx.globalCompositeOperation = 'destination-out';
      dctx.strokeStyle = 'rgba(0,0,0,1)';
    } else {
      dctx.globalCompositeOperation = 'source-over';
      dctx.strokeStyle = stroke.color;
    }
    dctx.beginPath();
    const pts = stroke.points;
    dctx.moveTo(pts[0].x, pts[0].y);
    for(let i=1;i<pts.length;i++){
      const p = pts[i];
      dctx.lineWidth = stroke.size * (p.p || 1);
      dctx.lineTo(p.x, p.y);
      dctx.stroke();
      dctx.beginPath();
      dctx.moveTo(p.x, p.y);
    }
    dctx.globalCompositeOperation = 'source-over';
  }

  let activeStroke = null;
  let activeStrokeOwnerId = null;

  function getPos(evt){
    const rect = drawCanvas.getBoundingClientRect();
    return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
  }

  function pressureFor(evt){
    if(evt.pointerType === 'pen' && evt.pressure > 0) return 0.5 + evt.pressure*1.1;
    return 1;
  }

  drawCanvas.addEventListener('pointerdown', (evt)=>{
    evt.preventDefault();

    // Palm rejection: while the Pencil is actively down, ignore any finger
    // touch outright (it's almost certainly a resting palm). Also ignore any
    // touch whose contact patch is much bigger than a fingertip.
    if(evt.pointerType === 'touch'){
      if(activePenId !== null) return;
      const size = Math.max(evt.width||0, evt.height||0);
      if(size > PALM_SIZE_THRESHOLD) return;
    }

    drawCanvas.setPointerCapture(evt.pointerId);
    if(evt.pointerType === 'pen'){
      activePenId = evt.pointerId;
    }

    const pos = getPos(evt);
    activeStroke = {
      color: currentColor,
      size: Number(brushSize.value),
      erase: erasing,
      points: [{x:pos.x, y:pos.y, p:pressureFor(evt)}]
    };
    activeStrokeOwnerId = evt.pointerId;
    strokes[currentField].push(activeStroke);
  });

  drawCanvas.addEventListener('pointermove', (evt)=>{
    if(!activeStroke || evt.pointerId !== activeStrokeOwnerId) return;
    evt.preventDefault();
    const pos = getPos(evt);
    activeStroke.points.push({x:pos.x, y:pos.y, p:pressureFor(evt)});
    paintStroke({...activeStroke, points: activeStroke.points.slice(-2)});
  });

  function endPointer(evt){
    if(evt.pointerType === 'pen' && activePenId === evt.pointerId){
      activePenId = null;
    }
    if(activeStrokeOwnerId === evt.pointerId){
      activeStroke = null;
      activeStrokeOwnerId = null;
      saveStrokes();
    }
  }
  drawCanvas.addEventListener('pointerup', endPointer);
  drawCanvas.addEventListener('pointercancel', endPointer);
  drawCanvas.addEventListener('pointerleave', endPointer);

  // ---------- Controls ----------
  tabs.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      tabs.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentField = btn.dataset.field;
      fitFrame();
    });
  });

  swatches.forEach(sw=>{
    sw.addEventListener('click', ()=>{
      swatches.forEach(s=>s.classList.remove('active'));
      sw.classList.add('active');
      currentColor = sw.dataset.color;
      erasing = false;
      eraserBtn.classList.remove('active');
    });
  });

  eraserBtn.addEventListener('click', ()=>{
    erasing = !erasing;
    eraserBtn.classList.toggle('active', erasing);
  });

  undoBtn.addEventListener('click', ()=>{
    strokes[currentField].pop();
    redrawStrokes();
    saveStrokes();
  });

  clearBtn.addEventListener('click', ()=>{
    strokes[currentField] = [];
    redrawStrokes();
    saveStrokes();
  });

  saveBtn.addEventListener('click', ()=>{
    const w = fieldCanvas.width, h = fieldCanvas.height;
    const merged = document.createElement('canvas');
    merged.width = w; merged.height = h;
    const mctx = merged.getContext('2d');
    mctx.fillStyle = '#123262';
    mctx.fillRect(0,0,w,h);
    mctx.drawImage(fieldCanvas, 0, 0);
    mctx.drawImage(drawCanvas, 0, 0);
    const link = document.createElement('a');
    link.download = 'quadro-tatico-' + currentField + '.png';
    link.href = merged.toDataURL('image/png');
    link.click();
  });

  window.addEventListener('resize', fitFrame);
  fitFrame();

  // App-like feel: no text selection, no callout/loupe on long-press, no
  // right-click menu, no dragging images, and no native page pinch-zoom
  // (the board has its own pinch-zoom implemented above).
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('selectstart', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('gesturechange', e => e.preventDefault());
  document.addEventListener('gestureend', e => e.preventDefault());

  // Register a minimal service worker so Chrome/Android recognise this
  // page as an installable PWA (required alongside the manifest).
  if ('serviceWorker' in navigator) {
    try {
      const swCode = "self.addEventListener('fetch', function(e){});";
      const swBlob = new Blob([swCode], {type: 'text/javascript'});
      navigator.serviceWorker.register(URL.createObjectURL(swBlob));
    } catch(e) { /* ignore if blocked */ }
  }
})();
</script>
</body>
</html>
